services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER : meterly
      POSTGRES_PASSWORD: meterly
      POSTGRES_DB : meterly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  redis:
    image : redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
  
  mock_upstream:
    build: ./mock_upstream
    ports:
      - "8002:8002"
  
  gateway:
    build: ./gateway
    ports:
      - "8001:8001"
    env_file: .env
    depends_on:
      - postgres
      - redis
  
  controlplance:
    build: ./controlplane
    ports:
      - "8000:8000"
    env_file: ./env
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data: